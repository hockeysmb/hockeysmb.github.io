<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#681825">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMB Femenino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<title>SMB Femenino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Caveat:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f5f2f2; --surface: #ffffff; --fill: #f1ebec; --fg: #221c1d; --muted: #6b6163; --line: #e2d8d9;
  --accent: #681825; --accent-ink: #ffffff; --accent-soft: #f2e5e7;
  --good: #2e6b46; --good-soft: #e3f1e8; --warn: #8a5a00; --warn-soft: #fbefd6; --bad: #a3261d; --bad-soft: #f9e2df;
  --chart: #681825; --chart-2: #b9a3a7; --grid: #ece4e5;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --font-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171314; --surface: #221d1e; --fill: #2d2627; --fg: #f3eded; --muted: #b3a8aa; --line: #3a3233;
  --accent: #e3949f; --accent-ink: #1c1213; --accent-soft: #3a2328;
  --good: #8fd0a8; --good-soft: #1d3326; --warn: #f2c46b; --warn-soft: #3a2e12; --bad: #f3a29b; --bad-soft: #42201d;
  --chart: #e3949f; --chart-2: #6f5d60; --grid: #332b2c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171314; --surface: #221d1e; --fill: #2d2627; --fg: #f3eded; --muted: #b3a8aa; --line: #3a3233;
  --accent: #e3949f; --accent-ink: #1c1213; --accent-soft: #3a2328;
  --good: #8fd0a8; --good-soft: #1d3326; --warn: #f2c46b; --warn-soft: #3a2e12; --bad: #f3a29b; --bad-soft: #42201d;
  --chart: #e3949f; --chart-2: #6f5d60; --grid: #332b2c; color-scheme: dark; }
* { box-sizing: border-box; }
html { padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font: 700 30px/1.05 var(--font-display); letter-spacing: .005em; }
h2 { font-size: 18px; } h3 { font-size: 15px; }
p { margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; display: grid; gap: 14px; }
.wrap.wide { max-width: 1120px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand img { width: 34px; height: 34px; border-radius: 50%; background: #fff; flex: none; }
.brand b { display: block; font: 700 19px/1 var(--font-display); color: var(--accent); }
.brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav button { flex: 1; max-width: 160px; border: 0; background: transparent; color: var(--muted); padding: 8px 4px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.done { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13.5px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 42px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { min-height: 34px; padding: 6px 10px; font-size: 13.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 6px; font-weight: 600; font-size: 13.5px; }
.field input, .field select, .field textarea { font-weight: 400; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); min-width: 0; width: 100%; }
.field textarea { min-height: 72px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.msg { font-size: 14px; min-height: 0; } .msg.err { color: var(--bad); } .msg.ok { color: var(--good); }
/* escalas */
.q { display: grid; gap: 6px; }
.q-h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.q-h small { font-weight: 500; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale.s11 { grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
.scale.s3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.scale button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; min-height: 44px; padding: 4px 2px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; display: grid; place-items: center; gap: 0; line-height: 1.1; }
.scale button small { font-weight: 500; font-size: 11px; color: var(--muted); }
.scale button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.scale button[aria-pressed="true"] small { color: inherit; }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.rpe-lbl { font-size: 14px; font-weight: 600; color: var(--accent); min-height: 1.4em; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.stepper { justify-self: start; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { border: 0; background: var(--fill); width: 42px; height: 42px; font-size: 20px; cursor: pointer; }
.stepper output { min-width: 74px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; background: var(--fill); }
/* estado (semáforo): siempre con icono y palabra */
.st { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.st svg { width: 14px; height: 14px; flex: none; }
.st.ok { color: var(--good); background: var(--good-soft); } .st.warn { color: var(--warn); background: var(--warn-soft); } .st.bad { color: var(--bad); background: var(--bad-soft); } .st.none { color: var(--muted); background: var(--fill); }
/* gráficos */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10.5px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .band { fill: var(--chart-2); opacity: .35; }
.chart .dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart .bar { fill: var(--chart); }
.chart .bar.now { fill: var(--chart-2); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .tip, .chart g.m:hover .tipg { opacity: 1; }
.tipg { opacity: 0; pointer-events: none; transition: opacity .12s; }
.tipg rect { fill: var(--fg); } .tipg text { fill: var(--bg); font-weight: 600; }
.chart-note { font-size: 12.5px; color: var(--muted); }
/* tablas */
.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--fill); }
.gate { min-height: 100vh; display: grid; justify-items: center; align-items: safe center; padding: 16px; }
.gate .card { width: min(440px, 100%); }
.gate-logo { display: grid; justify-items: center; gap: 6px; text-align: center; }
.gate-logo img { width: 64px; height: 64px; border-radius: 50%; background: #fff; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; } .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.info { display: grid; gap: 8px; font-size: 14px; } .info ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.code { font: 600 14px/1.3 ui-monospace, Menlo, monospace; background: var(--fill); padding: 8px 10px; border-radius: 8px; word-break: break-all; user-select: all; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.li b { display: block; } .li small { color: var(--muted); }
.obj { display: grid; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.obj:first-child { border-top: 0; padding-top: 0; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 860px) { .two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.back { justify-self: start; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
@media (max-width: 420px) { .scale.s11 button { min-height: 40px; font-size: 13px; } h1 { font-size: 27px; } }
/* caras */
.face { width: 34px; height: 34px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.face .e { fill: currentColor; stroke: none; }
.btn.big { min-height: 52px; font-size: 16px; }
.center { text-align: center; }
.faces { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.mf { display: grid; justify-items: center; gap: 2px; text-align: center; color: var(--accent); }
.mf b { font-size: 12px; color: var(--fg); } .mf small { font-size: 11px; color: var(--muted); line-height: 1.2; }
/* antes del entreno: una pregunta por pantalla */
.flow { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }
.flow-top { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; } .dots span { width: 26px; height: 6px; border-radius: 3px; background: var(--line); } .dots span.on { background: var(--accent); }
.flow-in { padding-top: 26px; gap: 20px; }
.flow-q { font-size: 42px; line-height: 1; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 17px; text-align: left; cursor: pointer; }
.opt .face { color: var(--muted); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .opt[aria-pressed="true"] .face { color: var(--accent-ink); }
/* después: cinco niveles */
.lvls { display: grid; gap: 8px; }
.lvl { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 16px; text-align: left; cursor: pointer; }
.lvl small { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--muted); }
.lvl[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 24px; flex: none; } .bars i { display: block; width: 6px; border-radius: 2px; background: var(--line); } .bars i.f { background: var(--accent); }
/* mi jugadora */
.hola { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.me-chip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 4px 10px 4px 4px; cursor: pointer; color: var(--fg); flex: none; }
.me-chip .av { width: 44px; height: 44px; } .me-chip span { display: grid; text-align: left; line-height: 1.15; } .me-chip b { font-size: 13px; } .me-chip small { font-size: 12px; color: var(--muted); }
.av { display: block; width: 100%; height: auto; }
.me-card { grid-template-columns: 120px minmax(0, 1fr); align-items: center; gap: 14px; }
.me-av { width: 120px; } .me-av.big { width: min(220px, 70%); justify-self: center; }
.me-info { display: grid; gap: 6px; justify-items: start; min-width: 0; }
.me-lv { font: 700 28px/1 var(--font-display); }
.prog { width: 100%; height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.pts { list-style: none; margin: 0; padding: 0; } .pts li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; } .pts li:last-child { border-bottom: 0; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.seg button.locked { color: var(--muted); background: var(--fill); border-style: dashed; cursor: default; }
/* resumen de la DT */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 12px; display: grid; gap: 3px; min-width: 0; align-content: start; }
.tile .k { font-size: 12px; color: var(--muted); line-height: 1.25; } .tile .v { font: 700 30px/1 var(--font-display); font-variant-numeric: tabular-nums; } .tile .s { font-size: 12px; color: var(--muted); }
.al-h { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.al-h svg { width: 16px; height: 16px; } .al-h.bad { color: var(--bad); } .al-h.warn { color: var(--warn); }
.al-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.al-row { width: 100%; display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 10px 12px; cursor: pointer; font-size: 13.5px; }
.al-row b { font-size: 15px; } .al-row span { color: var(--muted); }
/* diario de la semana */
.row.between { justify-content: space-between; } .row.tight { gap: 5px; flex-wrap: nowrap; } .grow { flex: 1; }
.diary-hero { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 14px 16px 16px; display: grid; gap: 10px; }
.diary-hero .kicker { color: inherit; opacity: .85; } .diary-hero .sm { font-size: 12px; opacity: .85; }
.diary-hero h1 { font-size: 30px; line-height: 1; color: inherit; }
.wxs { display: flex; justify-content: space-between; gap: 6px; }
.wx { width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-ink) 14%, transparent); color: var(--accent-ink); cursor: pointer; }
.wx:disabled { cursor: default; opacity: .55; } .wx[aria-pressed="true"] { background: var(--accent-ink); color: var(--accent); opacity: 1; }
.wx-i { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.wx-l { font-size: 13px; font-weight: 600; opacity: .9; }
.pg { background: var(--surface); border-radius: 18px; padding: 12px 14px 10px; display: grid; gap: 4px; box-shadow: 0 1px 0 var(--line); }
.pg-h { display: flex; align-items: center; gap: 8px; font: 700 19px/1 var(--font-display); }
.pg-h i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); }
.pg-h svg { width: 15px; height: 15px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ln { margin: 0; width: 100%; min-height: 58px; border: 0; resize: none; padding: 1px 0 0; background-color: transparent; font: 500 23px/29px "Caveat", "Segoe Print", cursive; color: var(--fg);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 28px, var(--line) 28px, var(--line) 29px); outline: none; white-space: pre-wrap; }
.ln::placeholder { color: var(--muted); }
.ln:focus-visible { box-shadow: 0 2px 0 var(--accent); }
.pledge { background: var(--fg); color: var(--bg); border-radius: 18px; padding: 12px 14px; display: grid; gap: 8px; }
.pl-h { font: 700 19px/1 var(--font-display); }
.pl-in, .pl-t { margin: 0; width: 100%; border: 0; border-bottom: 1px solid color-mix(in srgb, var(--bg) 30%, transparent); background: transparent; color: #f3e3c0; font: 500 24px/30px "Caveat", "Segoe Print", cursive; padding: 0; outline: none; }
.pl-t { border-bottom: 0; }
.pl-in::placeholder { color: color-mix(in srgb, var(--bg) 55%, transparent); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: #c9a227; color: #221c1d; padding: 4px 8px; border-radius: 6px; }
.seg.dark button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.seg.dark button[aria-pressed="true"] { background: #c9a227; border-color: #c9a227; color: #221c1d; }
.tks { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.tk { flex: none; width: 184px; scroll-snap-align: start; background: var(--surface); border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; align-content: start; box-shadow: 0 1px 0 var(--line); }
.tk .d { font-size: 11.5px; color: var(--muted); } .tk .t { font: 500 20px/1.05 "Caveat", "Segoe Print", cursive; }
.mini { white-space: nowrap; min-height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 12px; cursor: pointer; }
.mini[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stamp { justify-self: start; margin-top: 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; border: 2px solid; transform: rotate(-4deg); }
.stamp.si { color: var(--good); } .stamp.medias { color: var(--warn); } .stamp.no { color: var(--muted); }
