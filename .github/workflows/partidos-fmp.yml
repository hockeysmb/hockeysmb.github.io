name: Partidos de la federación
# Dos veces al día lee el calendario de la Federación Madrileña (Sub-15, Sub-17 y 1ª Autonómica femenina)
# y, si ha cambiado algo (horas, fechas, resultados), actualiza femenino/partidos.json. La app lo coge sola.
on:
  schedule:
    # Dos veces al día. GitHub retrasa lo programado cuando hay cola: con '17 5' las últimas
    # semanas estaba corriendo sobre las 13:45 de Madrid, demasiado tarde para un cambio de hora
    # de un partido del día siguiente. Con la de medianoche, una lectura cae siempre por la mañana.
    - cron: '17 0 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fuente/partidos_fmp.py', '.github/workflows/partidos-fmp.yml']
permissions:
  contents: write
concurrency: partidos-fmp
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fuente/partidos_fmp.py
      - name: Guardar si ha cambiado
        run: |
          git config user.name "partidos-fmp"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add femenino/partidos.json
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Partidos: actualizados desde la federación" && git push; fi
