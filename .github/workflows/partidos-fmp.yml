name: Partidos de la federación
# Dos veces al día lee el calendario de la Federación Madrileña (los 14 equipos del SMB que compiten)
# y, si ha cambiado algo (horas, fechas, resultados), actualiza femenino/partidos.json. Lo cogen solas
# la app de jugadoras y la de entrenadores.
#
# Desde que la federación cambió el portal (28 de octubre de 2026) no vale con pedir el HTML: la web es
# una aplicación de JavaScript. Por eso abrimos la página pública con Chromium, igual que una persona.
on:
  schedule:
    # Dos veces al día. GitHub retrasa lo programado cuando hay cola: con '17 5' las últimas
    # semanas estaba corriendo sobre las 13:45 de Madrid, demasiado tarde para un cambio de hora
    # de un partido del día siguiente. Con la de medianoche, una lectura cae siempre por la mañana.
    - cron: '17 0 * * *'
    - cron: '17 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fuente/partidos_fmp.py', '.github/workflows/partidos-fmp.yml']
permissions:
  contents: write
concurrency: partidos-fmp
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Preparar el navegador
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Leer los partidos
        run: python3 fuente/partidos_fmp.py --ver
        timeout-minutes: 15
      - name: Guardar si ha cambiado
        run: |
          git config user.name "partidos-fmp"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in femenino/partidos.json partidos.json; do [ -f "$f" ] && git add "$f" || true; done
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Partidos: actualizados desde la federación" && git push; fi
