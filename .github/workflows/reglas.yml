name: Reglas de Firestore
# Prueba firestore.rules contra el emulador oficial de Firebase cada vez que cambian.
# Las reglas se publican a mano en la consola: esto comprueba que lo que se va a pegar hace lo que debe.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'fuente/pruebas/reglas/**', '.github/workflows/reglas.yml']
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: fuente/pruebas/reglas } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - run: npm install --no-audit --no-fund
      - run: npx firebase emulators:exec --only firestore --project demo-smb "node reglas.test.mjs"
