name: Sonda clasificación (temporal)
on:
  push:
    branches: [main]
    paths: ['fuente/sonda/**', '.github/workflows/sonda.yml']
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet playwright && python3 -m playwright install --with-deps chromium
      - run: python3 fuente/sonda/clasif.py
        timeout-minutes: 8
